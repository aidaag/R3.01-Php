<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire des Signes Astrologiques Chinois</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Signes Astrologiques Chinois</h1>
    </header>
    <main>
        <p>
            Ce site a l'objectif pédagogique de montrer l'utilisation d'un formulaire.
            Il vous propose de vous calculer votre signe
            dans l'astrologie chinoise.
        </p>
        <section>
            <form>
                <h2>Découvrez Votre Signe</h2>
            <form action="traiter.php" method="get">
                <label>
                     Votre nom :
                    <input type="text" name="nom">
                </label>
                <label>
                    Votre age a la fin de cette année(entre 18 et 12) :
                    <input type="number" id="age" name="age"  min="18" max="120" required>
                </label>
                <button type="submit"> Envoyer </button>
                       

                <fieldset>
                    <legend>Votre genre</legend>
                    <label>
                        <input type="radio" id="genre" name="genre" value="femme" required>
                        femme
                        <input type="radio" id="genre" name="genre" value="homme" required>
                        homme
                        <input type="radio" id="genre" name="genre" value="Autre" required>
                        Autre
                    </label>
                </fieldset>
            </form>
            </form>
        </section>
    </main>
    <footer>
        <p> 2024 Votre Site Astrologique</p>
    </footer>
</body>

</html>
